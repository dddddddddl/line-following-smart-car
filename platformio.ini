; Reproducible build entry added during portfolio preparation.
; The project report identifies Arduino Nano. The kit manual supports
; ATmega328P as the compile target; the physical board was not inspected.
[platformio]
src_dir = firmware/line_following_car

[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 9600
